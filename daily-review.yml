name: 每日A股持仓复盘
on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 等待收盘数据落定
        if: github.event_name == 'schedule'
        run: sleep 600
      - name: 抓取并生成并发布
        run: python publish.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: 存档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: data
          retention-days: 90