name: 每日A股持仓复盘
on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取并生成
        run: |
          python fetch_market.py data
          DATE=$(python -c "import json;print(json.load(open('data/market.json'))['trade_date'])")
          TODAY=$(TZ=Asia/Shanghai date +%F)
          if [ "$DATE" != "$TODAY" ]; then
            echo "非交易日（最新行情 $DATE），跳过发布"
            exit 0
          fi
          mkdir -p site
          python generate_report.py data/market.json "site/$DATE.html"
          cp "site/$DATE.html" site/latest.html
          python update_index.py site
          echo "生成完成 $DATE"
      - name: 发布到 gh-pages
        run: |
          if [ ! -f site/index.html ]; then
            echo "非交易日，无内容可发布"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd site
          git init -q && git checkout -q -B gh-pages
          git add -A && git commit -q -m "review"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          echo "已发布"
      - name: 存档原始数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: data/market.json
          retention-days: 90
